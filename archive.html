<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browse approved AI Daily editions by date, title, keyword, or genre."><title>Archive — AI Daily</title><style>:root{color-scheme:light;background:#f7f8f3;color:#16211f;font:16px Georgia,serif}main{max-width:900px;margin:0 auto;padding:7vh 24px}a{color:#16211f}header,small,label{font:12px monospace;letter-spacing:.08em}h1{font-size:clamp(48px,9vw,88px);line-height:.9;margin:60px 0 24px}p{line-height:1.6;color:#536d65}.controls{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:30px 0}.controls input,.controls select{border:1px solid #cbd8cf;background:#fff;padding:13px;color:#16211f;font:14px sans-serif}.edition{border-top:1px solid #dfe6e1;padding:22px 0}.edition-head{display:flex;justify-content:space-between;gap:20px;align-items:baseline}.edition-head a{font-weight:bold}.story-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:14px}.story{border:1px solid #dfe6e1;background:#fff;padding:12px;text-decoration:none}.story strong{display:block;font:15px Georgia,serif}.story small{display:block;color:#71807b;margin-top:8px;font-size:10px}.empty{padding:25px 0;color:#71807b}.back{display:inline-block;margin-top:35px}@media(max-width:650px){.controls{grid-template-columns:1fr}.edition-head{display:block}}
</style></head><body><main><header><a data-home href="./">AI DAILY.</a> · APPROVED EDITIONS</header><h1>The archive.</h1><p>A quiet, searchable record of approved editions. Search stays in your browser; queries are not sent to a server.</p><form class="controls" role="search"><input id="query" type="search" placeholder="Search titles, keywords, sources…" aria-label="Search the archive"><select id="genre" aria-label="Filter by genre"><option value="">All genres</option></select></form><p id="status" aria-live="polite">Loading approved editions…</p><section id="results" aria-label="Approved editions"></section><a class="back" data-home href="./">← Return to today’s briefing</a></main><script>
const base = location.pathname.includes('/AI-Daily/') ? '/AI-Daily/' : './';
for (const link of document.querySelectorAll('[data-home]')) link.href = base;
const query = document.querySelector('#query'); const genre = document.querySelector('#genre'); const results = document.querySelector('#results'); const status = document.querySelector('#status'); let archive;
function render(){ const q=query.value.trim().toLowerCase(); const g=genre.value; const editions=(archive?.editions||[]).map(ed=>({...ed,stories:ed.stories.filter(story=>{const hay=[story.title,story.source,story.category,...story.keywords].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!g||story.category===g||story.keywords.includes(g));})})).filter(ed=>!q&&!g||ed.stories.length); status.textContent=`${editions.length} approved edition${editions.length===1?'':'s'} · search is local`; results.innerHTML=editions.length?editions.map(ed=>`<article class="edition"><div class="edition-head"><a href="${base}edition/${ed.date}">Edition ${ed.edition} · ${new Date(ed.published_at).toLocaleDateString('en-GB',{dateStyle:'long',timeZone:'UTC'})}</a><small>${ed.story_count} signals</small></div><div class="story-list">${ed.stories.slice(0, q||g?ed.stories.length:6).map(story=>`<a class="story" href="${base}edition/${ed.date}?story=${encodeURIComponent(story.event_id)}"><strong>${story.title}</strong><small>${story.category} · ${story.source} · ${story.keywords.join(' · ')}</small></a>`).join('')}</div></article>`).join(''):'<p class="empty">No approved signal matches that search.</p>'; }
fetch(base+'data/archive.json').then(response=>response.json()).then(data=>{archive=data;const genres=[...new Set(data.editions.flatMap(ed=>ed.stories.flatMap(story=>[story.category,...story.keywords])))] .filter(Boolean).sort();genre.innerHTML='<option value="">All genres</option>'+genres.map(value=>`<option>${value}</option>`).join('');render();}).catch(()=>{status.textContent='The archive is temporarily unavailable.';}); query.addEventListener('input',render); genre.addEventListener('change',render);
</script></body></html>
